services:
  neo4j:
    image: neo4j:5.18.0
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    volumes:
      - ./data/neo4j:/data
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    restart: unless-stopped
    networks:
      - graphrag-network

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: graphrag-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    networks:
      - graphrag-network

networks:
  graphrag-network:
    driver: bridge
