version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0
    container_name: graphrag-neo4j
    ports:
      - "7474:7474" # Trình duyệt Web
      - "7687:7687" # Cổng kết nối cho Python Driver
    environment:
      - NEO4J_AUTH=neo4j/password123 # Tài khoản mặc định
      - NEO4J_PLUGINS=["apoc"] # Thư viện hỗ trợ truy vấn đồ thị nâng cao
    volumes:
      - ../data/neo4j_data:/data # Lưu dữ liệu ra thư mục local
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: graphrag-qdrant
    ports:
      - "6333:6333" # Cổng REST API
      - "6334:6334" # Cổng gRPC
    volumes:
      - ../data/qdrant_data:/qdrant/storage
    restart: unless-stopped